services:
  - type: web
    name: wordslive
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        value: ozif.mc@gmail.com
      - key: SMTP_PASS
        value: htmabwuerlwbgvii
      - key: SMTP_FROM
        value: WordsLive <ozif.mc@gmail.com>
